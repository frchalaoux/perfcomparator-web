name: Test PerfComparator Web

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check perfcomparatorweb tests
      - name: Test
        run: uv run pytest -q
