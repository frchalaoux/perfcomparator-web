[project]
name = "perfcomparatorweb"
version = "0.1.0"
description = "Interface Web locale de PerfComparator"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "platformdirs>=4.3,<5",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/frchalaoux/perfcomparator-web"
Repository = "https://github.com/frchalaoux/perfcomparator-web.git"
Issues = "https://github.com/frchalaoux/perfcomparator-web/issues"

[project.scripts]
perfcomparatorweb = "perfcomparatorweb.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perfcomparatorweb"]

[tool.ruff]
line-length = 100
target-version = "py314"
